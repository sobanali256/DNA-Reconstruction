# Day 4 fallback check: BBS with beam width 100 on the 1,000-cluster dev pilot, scored as
# a fallback for default BBS by configs/pilot_cascade_beam100.yaml.
experiment_name: pilot_bbs_beam100
dataset: configs/dataset_microsoft.yaml
clusters: data/splits/microsoft_pilot1000.csv
method: bbs_only
bbs:
  config: configs/bbs_beam100.yaml
  threads: 4       # physical cores
  shards: 1
repetitions: 1
output_root: results/
