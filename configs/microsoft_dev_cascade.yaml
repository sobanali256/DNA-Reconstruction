# Days 5-7: Day 4 analyses (2x2, failure AUROC, tau sweep) on the full Microsoft dev split.
#   .venv/bin/python analysis/cascade_from_cache.py configs/microsoft_dev_cascade.yaml
# Paths are relative to the repository root. Dev clusters only: tau is chosen on dev.
bbs_run: results/microsoft_dev_bbs-20261001-213122-r1   # canonical BBS run (microsoft_dev_bbs)
fallback_run: results/microsoft_dev_itr-20261001-213129-r1   # ITR-only run (microsoft_dev_itr)
split: dev
dataset: configs/dataset_microsoft.yaml   # ground truth + reads, for itr_failure_modes.py only
# Route to ITR iff BBS confidence < tau. 0 = BBS only, 1 = everything but confidence 1.
# Grid from the dev confidence distribution (5th percentile of correct clusters: 0.88).
taus: [0, 0.5, 0.6, 0.7, 0.8, 0.9, 0.95, 0.99, 1.0]
bootstrap:            # 95% CI of the AUROC
  n_resamples: 2000
  seed: 20261001
output_prefix: results/summary/microsoft_dev   # writes <prefix>_cascade.csv and <prefix>_tau_sweep.csv
