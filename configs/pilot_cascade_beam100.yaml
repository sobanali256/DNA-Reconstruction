# Day 4 fallback check: BBS beam width 100 as the fallback for default BBS (beam 20).
#   .venv/bin/python analysis/cascade_from_cache.py configs/pilot_cascade_beam100.yaml
# Paths are relative to the repository root. Dev clusters only: tau is chosen on dev.
bbs_run: results/pilot_bbs-20260930-191013-r1   # canonical BBS run
fallback_run: results/pilot_bbs_beam100-20261001-193709-r1   # BBS, beam width 100
split: dev
# Route to the fallback iff BBS confidence < tau. 0 = BBS only, 1 = everything but confidence 1.
# Grid from the dev confidence distribution (5th percentile of correct clusters: 0.88).
taus: [0, 0.5, 0.6, 0.7, 0.8, 0.9, 0.95, 0.99, 1.0]
bootstrap:            # 95% CI of the AUROC
  n_resamples: 2000
  seed: 20261001
output_prefix: results/summary/pilot_beam100   # writes <prefix>_cascade.csv and <prefix>_tau_sweep.csv
