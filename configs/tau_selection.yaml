# Week 2: primary confidence threshold per dataset family, chosen on dev only.
#   .venv/bin/python analysis/select_tau.py configs/tau_selection.yaml
# Rule: cheapest tau (lowest share routed to ITR) whose pooled dev exact rate is within
# `tolerance` of the best tau in the grid. Primary = global tau, default selector.
# Per-condition rows (synthetic) are a labeled oracle analysis, not a deployable policy.
families:
  synthetic:
    bbs_run: results/synthetic_dev_bbs-20261001-223625-r1
    fallback_run: results/synthetic_dev_itr-20261001-223644-r1
    group_by: dataset_id     # adds per-condition oracle rows
  microsoft:
    bbs_run: results/microsoft_dev_bbs-20261001-213122-r1
    fallback_run: results/microsoft_dev_itr-20261001-213129-r1
taus: [0, 0.5, 0.6, 0.7, 0.8, 0.9, 0.95, 0.99, 1.0]   # same grid as the cascade analyses
objective:
  tolerance: 0.0025          # 0.25 percentage points of exact-match rate
output_prefix: results/summary/tau_selection   # writes <prefix>.csv
