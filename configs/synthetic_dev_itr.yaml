# Full cache, ITR-only baseline on the dev split of the synthetic grid (all 13
# conditions). One worker, so the per-cluster times are the clean serial cost (the
# workload model for the scheduler study). ITR is deterministic (Day 2), so one repetition.
experiment_name: synthetic_dev_itr
dataset: configs/dataset_synthetic.yaml
clusters: data/splits/synthetic_grid_split.csv
split: dev          # only the dev clusters of the list
method: itr_only
itr:
  config: configs/itr.yaml
  workers: 1
  microbatch_size: 25
repetitions: 1
output_root: results/
