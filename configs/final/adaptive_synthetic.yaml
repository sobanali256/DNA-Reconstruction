# FROZEN (methodology freeze): the primary adaptive policy for the synthetic grid, held-out test split.
#   .venv/bin/python scripts/run_experiment.py configs/final/adaptive_synthetic.yaml
# tau 0.8 = analysis/select_tau.py on dev only (results/summary/tau_selection.csv): cheapest tau
# within 0.25 points of the best pooled dev exact rate; default selector. Also the base of the
# scaling campaigns (configs/scaling_smoke.yaml, configs/final/scaling.yaml).
experiment_name: final_synthetic_test_adaptive
dataset: configs/dataset_synthetic.yaml
clusters: data/splits/synthetic_grid_split.csv
split: test
method: adaptive
tau: 0.8
selector: default
bbs:
  config: configs/bbs.yaml
  threads: 4          # = itr.workers: one native-concurrency cap for both stages
  shards: 1
itr:
  config: configs/itr.yaml
  scheduler: dynamic
  workers: 4          # physical cores
  microbatch_size: 5
  partition_seed: 20261002   # used by the static schedulers only
repetitions: 1
output_root: results/
