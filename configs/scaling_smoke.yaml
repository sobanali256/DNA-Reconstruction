# Week 2 smoke test of the scaling campaign: the full cell matrix on a small DEV sample
# (10 clusters per synthetic condition), to check the machinery, not to report timings.
#   .venv/bin/python scripts/make_smoke_list.py configs/scaling_smoke.yaml   # once
#   .venv/bin/python scripts/run_scaling.py configs/scaling_smoke.yaml
#   .venv/bin/python analysis/scaling_summary.py configs/scaling_smoke.yaml
campaign: scaling_smoke
base: configs/final/adaptive_synthetic.yaml   # frozen tau, selector and engine settings
overrides:                                    # replaces these top-level keys of the base
  split: dev
  clusters: data/splits/scaling_smoke.csv
sample:                                       # for scripts/make_smoke_list.py
  dataset: configs/dataset_synthetic.yaml
  split_file: data/splits/synthetic_grid_split.csv
  per_condition: 10
  seed: 20261002
  output_path: data/splits/scaling_smoke.csv
# One cell = scheduler x workers. bbs.threads is set to the cell's workers (one global
# native-concurrency cap). The serial cell is T1 for speedup. 8 workers = hyper-threaded.
cells:
  - {scheduler: serial, workers: [1]}
  - {scheduler: dynamic, workers: [1, 2, 4, 8]}
  - {scheduler: static, workers: [2, 4, 8]}
  - {scheduler: static_lpt, workers: [4]}
warmup: 1          # unmeasured runs of the first cell before repetition 1
repetitions: 3     # cell order rotates by one position each repetition
output_prefix: results/summary/scaling_smoke   # analysis: <prefix>_runs.csv, <prefix>_cells.csv
