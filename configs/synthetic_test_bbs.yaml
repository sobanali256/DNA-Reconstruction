# Full cache, BBS-only baseline on the test split of the synthetic grid (all 13
# conditions). One repetition: the canonical run (BBS run-to-run variability was
# measured on the pilot).
experiment_name: synthetic_test_bbs
dataset: configs/dataset_synthetic.yaml
clusters: data/splits/synthetic_grid_split.csv
split: test          # only the test clusters of the list
method: bbs_only
bbs:
  config: configs/bbs.yaml
  threads: 4       # physical cores; thread count changes speed only, not results
  shards: 1
repetitions: 1
output_root: results/
