# Full cache, ITR-only baseline on the test split of the Microsoft CNR. One worker, so the
# per-cluster times are the clean serial cost (the workload model for the scheduler
# study). ITR is deterministic (Day 2), so one repetition.
experiment_name: microsoft_test_itr
dataset: configs/dataset_microsoft.yaml
clusters: data/splits/microsoft_cnr_split.csv
split: test          # only the test clusters of the list
method: itr_only
itr:
  config: configs/itr.yaml
  workers: 1
  microbatch_size: 25
repetitions: 1
output_root: results/
